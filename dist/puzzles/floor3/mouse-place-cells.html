<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>איך עכבר יודע איפה הוא נמצא?</h1>
      </div>
      <div class="step-badge" id="stepBadge">שלב 1 מתוך 5</div>
    </header>
    <div class="stepper" id="stepper" aria-label="התקדמות הפעילות"></div>
    <section class="scene-shell" aria-label="סימולציית עכבר ותאי מיקום">
      <div class="scene-title" id="sceneTitle">העכבר בקופסה</div>
      <canvas id="scene" role="img" aria-label="מבט מלמעלה על עכבר שמשוטט בתוך קופסה גדולה."></canvas>
      <div class="screen-panel" id="screenPanel"></div>
    </section>
  </main>

  <script>
    (() => {
      const canvas=document.getElementById('scene'), ctx=canvas.getContext('2d');
      const panel=document.getElementById('screenPanel'), title=document.getElementById('sceneTitle');
      const badge=document.getElementById('stepBadge'), stepper=document.getElementById('stepper');
      const W=1120,H=660, TAU=Math.PI*2, ROUTE_DURATION=30,ROUTE_FPS=60,box={x:46,y:38,w:1028,h:584}, inner={x:65,y:57,w:990,h:546};
      let routeFrames={single:[],network:[]}, routeSpikes={single:[[]],network:Array.from({length:6},()=>[])}, routeWindows={single:[],network:[]};
      const timeColor=(index,alpha=1)=>`hsla(${(198+index*137.508)%360},52%,72%,${alpha})`;
      const neuronColors=['#e58b70','#71c1a5','#83a9e3','#d3a65e','#b18bd2','#62bdc9'];
      const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
      const labels=['שמאל עליון','מרכז עליון','ימין עליון','שמאל תחתון','מרכז תחתון','ימין תחתון'];
      const screens=['intro','singleObserve','singleQuiz','networkObserve','networkQuiz'];
      let screen='intro', dpr=1, time=0, last=performance.now(), running=true, speed=1.6, elapsed=0;
      let staticLayer,staticCtx,mouse,grains=[],seeds=[],paws=[],motes=[];
      const arena={x:46,y:38,w:1028,h:584}, dish={x:895,y:168,r:37};
      const shelters=[{x:862,y:444,w:120,h:73,a:-.12},{x:228,y:205,w:91,h:56,a:.08}];
      let traceCanvas,traceCtx,traceData=Array.from({length:6},()=>[]), quizCursor=0, activityTime=0, activityAccumulator=0, activityHistory=Array.from({length:6},()=>[]);
      let points={single:0,network:0}, chosen={single:[],network:[]}, revealed={single:false,network:false}, replayCompleted={single:false,network:false}, reflection={single:['',''],network:['','']};
      let networkMapping=Array(6).fill(''), mappingOpen=-1;
      let replayTime={single:0,network:0}, replayPlaying={single:false,network:false}, painting=false, paintedZones=new Set();
      const seed=724191; let rngSeed=seed;
      const random=()=>{rngSeed=(rngSeed*1664525+1013904223)>>>0;return rngSeed/4294967296};
      const rand=(a,b)=>a+random()*(b-a), lerp=(a,b,t)=>a+(b-a)*t;
      const furMarks=Array.from({length:68},(_,i)=>({x:Math.sin(i*12.9898)*9,y:Math.cos(i*7.123+1.7)*18,dx:Math.sin(i*3.731)*1.3,dy:2+((i*17)%13)/10,light:i%3===0}));
      function neuronSvg(color='#bcd49d'){return `<svg class="neuron-svg" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"><path d="M50 47 50 13M50 28 29 10M50 34 72 13M46 43 19 35M54 43 81 34M50 55 50 89M46 59 26 82M54 59 75 84"/><path d="M50 18 43 9M50 18 57 9M29 10 20 12M29 10 30 2M72 13 80 7M72 13 72 4M19 35 10 29M19 35 8 39M81 34 91 29M81 34 92 39M50 89 43 97M50 89 57 97M26 82 17 88M26 82 26 92M75 84 84 91M75 84 75 94"/></g><circle cx="50" cy="50" r="13" fill="#d9c28b" stroke="#f0ddb0" stroke-width="2"/></svg>`}
      function chart(){return `<canvas id="trace" class="trace-canvas" aria-label="תרשים פוטנציאלי פעולה לאורך זמן"></canvas><div class="trace-legend"><span>פוטנציאלי פעולה</span><span>זמן ←</span></div>`}
      function setScreen(s){
        screen=s;
        if(s==='singleQuiz')buildRouteData('single')
        if(s==='networkQuiz')buildRouteData('network')
        if(s==='singleObserve'||s==='networkObserve'){activityTime=0;activityAccumulator=0;activityHistory=Array.from({length:6},()=>[])}
        render();resize();last=performance.now()
      }
      function stepNum(){return screens.indexOf(screen)+1}
      function render(){
        document.body.classList.toggle('intro-screen',screen==='intro');
        document.body.classList.toggle('screen-revealed',(screen==='singleQuiz'&&revealed.single)||(screen==='networkQuiz'&&revealed.network));
        const n=stepNum(); badge.textContent=`שלב ${n} מתוך 5`; stepper.innerHTML=screens.map((_,i)=>`<span class="${i<n-1?'done':i===n-1?'current':''}"></span>`).join('');
        if(screen==='intro'){

      }
      function recordActivity(dt){activityAccumulator+=dt;while(activityAccumulator>=.08){activityAccumulator-=.08;activityTime+=.08;const activeZone=zone(mouse.x,mouse.y);for(let ch=0;ch<6;ch++){const field=screen==='networkObserve'?activeZone===ch:ch===0&&activeZone===1;activityHistory[ch].push({t:activityTime,spike:random()<(field?.96:.025)})}for(const row of activityHistory)while(row.length&&row[0].t<activityTime-5)row.shift()}}
      function updateNeuronCards(){if(screen!=='networkObserve')return;panel.querySelectorAll('.network-neuron').forEach(el=>el.classList.remove('active'))}
      function syncQuizMarks(){const k=currentQuizKind(),count=chosen[k].filter(x=>x.size).length,check=panel.querySelector('[data-action="reveal"]');if(check)check.disabled=count<chosen[k].length||points[k]<chosen[k].length||revealed[k];draw()}
      function syncMappingUI(){if(screen!=='networkObserve')return;const right=networkMapping.filter((z,i)=>z===String(i)).length,status=panel.querySelector('[data-map-status]'),button=panel.querySelector('[data-action="quiz2"]'),complete=right===6;if(status){status.textContent=`${right} מתוך 6 שויכו נכון`;status.classList.toggle('complete',complete)}if(button)button.disabled=!complete;panel.querySelectorAll('[data-map-trigger]').forEach(el=>{const i=Number(el.dataset.mapTrigger);el.innerHTML=mapPreviewMarkup(i);el.setAttribute('aria-label',networkMapping[i]===''?'בחרו משבצת לתא המיקום':`משבצת ${Number(networkMapping[i])+1} נבחרה לתא המיקום`)});panel.querySelectorAll('[data-map-select]').forEach(el=>{const i=Number(el.dataset.mapSelect),z=Number(el.dataset.zone),used=networkMapping.some((value,other)=>other!==i&&value===String(z));el.disabled=used;el.classList.toggle('selected',networkMapping[i]===String(z))});panel.querySelectorAll('[data-map-clear]').forEach(el=>{el.hidden=networkMapping[Number(el.dataset.mapClear)]==='' });panel.querySelectorAll('[data-map-picker]').forEach(el=>{const i=Number(el.dataset.mapPicker);el.hidden=mappingOpen!==i;el.closest('.network-neuron')?.classList.toggle('map-open',mappingOpen===i)})}
      function zoneAtPointer(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.width*W;if(x<inner.x||x>inner.x+inner.w||y<inner.y||y>inner.y+inner.h)return -1;return zone(x,y)}
      function markZone(z,mode){if(z<0||paintedZones.has(z))return;const k=currentQuizKind(),idx=points[k];if(idx>=chosen[k].length)return;paintedZones.add(z);const set=chosen[k][idx];if(mode==='toggle')set.has(z)?set.delete(z):set.add(z);else if(mode==='remove')set.delete(z);else set.add(z);syncQuizMarks()}
      function finishZoneSelection(){if(!painting)return;painting=false;paintedZones=new Set();const k=currentQuizKind(),idx=points[k];if(idx<chosen[k].length&&chosen[k][idx]?.size){points[k]=idx+1;syncQuizMarks()}}
      canvas.addEventListener('pointerdown',e=>{if(!['singleQuiz','networkQuiz'].includes(screen)||revealed[currentQuizKind()])return;const z=zoneAtPointer(e);if(z<0)return;e.preventDefault();painting=true;paintedZones=new Set();canvas.setPointerCapture(e.pointerId);markZone(z,e.shiftKey?'remove':'toggle')});
      canvas.addEventListener('pointermove',e=>{if(!painting)return;const z=zoneAtPointer(e);markZone(z,e.shiftKey?'remove':'add')});
      canvas.addEventListener('pointerup',finishZoneSelection);canvas.addEventListener('pointercancel',()=>{painting=false;paintedZones=new Set()});
      panel.addEventListener('click',e=>{if(e.target!==panel.querySelector('#trace')||!['singleQuiz','networkQuiz'].includes(screen)||revealed[currentQuizKind()])return;const k=currentQuizKind(),idx=points[k],selected=chosen[k][idx],r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1120,left=72,width=976,t=(x-left)/width*ROUTE_DURATION,clicked=(routeWindows[k]||[]).findIndex(w=>t>=w.start&&t<=w.end);if(clicked<0)return;if(clicked<idx){points[k]=clicked;syncQuizMarks();return}if(clicked===idx&&idx<routeWindows[k].length&&selected?.size){points[k]=idx+1;syncQuizMarks()}});
      panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action,k=currentQuizKind();
        if(b.hasAttribute('data-map-trigger')){const i=Number(b.dataset.mapTrigger);mappingOpen=mappingOpen===i?-1:i;syncMappingUI();return}
        if(b.hasAttribute('data-map-select')){const i=Number(b.dataset.mapSelect),z=Number(b.dataset.zone);if(networkMapping[i]===String(z)){networkMapping[i]='';mappingOpen=-1;syncMappingUI();return}if(networkMapping.some((value,other)=>other!==i&&value===String(z)))return;networkMapping[i]=String(z);mappingOpen=-1;syncMappingUI();return}if(b.hasAttribute('data-map-clear')){networkMapping[Number(b.dataset.mapClear)]='';mappingOpen=-1;syncMappingUI();return}
        if(a==='start')setScreen('singleObserve');else if(a==='quiz1')setScreen('singleQuiz');else if(a==='quiz2')setScreen('networkQuiz');
        else if(a==='reveal'&&chosen[k].length>0&&chosen[k].every(x=>x.size)&&points[k]>=chosen[k].length){revealed[k]=true;replayCompleted[k]=false;replayTime[k]=0;replayPlaying[k]=true;const p=routePosition(k,0);mouse.x=p.x;mouse.y=p.y;mouse.target=null;render();resize()}
        else if(a==='replay'){replayCompleted[k]=false;replayTime[k]=0;replayPlaying[k]=true;const p=routePosition(k,0);mouse.x=p.x;mouse.y=p.y;mouse.target=null;render();resize()}
        else if(a==='network'&&reflection.single.every(x=>x.trim()))setScreen('networkObserve')
        else if(a==='finish'&&reflection.network.every(x=>x.trim())){downloadAnswersReport();panel.innerHTML=`<div class="story-card"><h3>כל הכבוד, השלמתם את הפעילות!</h3><p>תא בודד מאותת על מקום מסוים כשהעכבר נמצא בו. רשת תאים משלימה יחד קוד מרחבי שמאפשר להעריך את מיקומו בכל רחבי הקופסה.</p><button class="primary" data-action="restart">התחילו מחדש</button></div>`}
        else if(a==='restart'){points={single:0,network:0};chosen={single:[],network:[]};revealed={single:false,network:false};replayCompleted={single:false,network:false};reflection={single:['',''],network:['','']};replayTime={single:0,network:0};replayPlaying={single:false,network:false};networkMapping=Array(6).fill('');setScreen('intro')}
      });
      panel.addEventListener('input',e=>{if(!e.target.matches('[data-ref]'))return;const k=screen==='singleQuiz'?'single':'network';reflection[k][+e.target.dataset.ref]=e.target.value;const btn=panel.querySelector('[data-action="network"],[data-action="finish"]');if(btn)btn.disabled=!reflection[k].every(x=>x.trim())});
      function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);updateNeuronCards();draw();requestAnimationFrame(frame)}
      window.addEventListener('resize',resize);render();resize();resetMouse();requestAnimationFrame(frame);
    })();
  </script>
  <script>
    (() => {
      let sent = false;
      const send = () => {
        if (sent) return;
        sent = true;
        window.parent.postMessage({ source: "neural-code-riddle", type: "submitted", puzzleId: "mouse-place-cells" }, "*");
      };
      document.addEventListener("click", (event) => {
        if (event.target.closest('[data-action="finish"]')) window.setTimeout(send, 350);
      });
    })();
  </script>
</body>
