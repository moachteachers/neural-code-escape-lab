<style data-standalone-responsive>
/* Shared responsive layer for every embedded riddle. Loaded after each riddle's
   original styles so the activities keep their visual identity without being
   scaled down to fit a short iframe. */

html {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-behavior: smooth;
}

body {
  zoom: 1 !important;
}

body[data-riddle] {
  width: 100%;
  max-width: 100%;
  min-height: 100%;
  zoom: 1 !important;
  overflow-x: hidden !important;
  overflow-y: auto !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body[data-riddle] img,
body[data-riddle] svg,
body[data-riddle] canvas {
  max-width: 100%;
}

body[data-riddle] button,
body[data-riddle] input,
body[data-riddle] textarea,
body[data-riddle] select {
  max-width: 100%;
}

/* Screen changes move focus to the new heading for assistive technology.
   Browsers otherwise draw a heavy rectangular ring around these non-control
   headings, which reads as an accidental overlap in the activity artwork. */
body[data-riddle] :is(h1, h2, h3)[tabindex="-1"]:focus {
  outline: none;
}

/* Floor 1 — dendritic workflow */
body[data-riddle^="dendritic-riddle"] .workflow-backdrop {
  height: 100dvh;
  padding: 14px;
  align-items: stretch;
}

body[data-riddle^="dendritic-riddle"] .workflow-dialog {
  width: min(1540px, 100%);
  height: calc(100dvh - 28px);
  max-height: none;
}

body[data-riddle^="dendritic-riddle"] .workflow-step:not([hidden]) {
  overflow-x: hidden !important;
  overflow-y: auto !important;
  overscroll-behavior: contain;
  scroll-padding-bottom: 78px;
}

body[data-riddle^="dendritic-riddle"] .workflow-step:not([hidden]) > .step-actions {
  position: sticky !important;
  z-index: 14;
  bottom: 0 !important;
  padding: 10px 8px 6px;
  border-top: 1px solid rgba(203, 213, 225, .72);
  background: linear-gradient(180deg, rgba(248, 251, 255, .12), #f8fbff 28%);
}

body[data-riddle^="dendritic-riddle"] .step-node {
  min-height: 42px;
  font-size: 12px !important;
  line-height: 1.25;
}

body[data-riddle^="dendritic-riddle"] .workflow-step .builder .box-title,
body[data-riddle^="dendritic-riddle"] .workflow-step .builder .main {
  font-size: 14px !important;
  line-height: 1.35 !important;
}

body[data-riddle^="dendritic-riddle"] .workflow-step .builder .sub,
body[data-riddle^="dendritic-riddle"] .workflow-step .builder .prepared-hint,
body[data-riddle^="dendritic-riddle"] .placed-row,
body[data-riddle^="dendritic-riddle"] .placed-details summary,
body[data-riddle^="dendritic-riddle"] .placed-list > b {
  font-size: 12px !important;
  line-height: 1.4;
}

body[data-riddle^="dendritic-riddle"] .board-wrap {
  height: clamp(330px, 48dvh, 540px) !important;
  min-height: 0 !important;
}

@media (max-width: 900px) {
  body[data-riddle^="dendritic-riddle"] .workflow-backdrop {
    padding: 0;
  }

  body[data-riddle^="dendritic-riddle"] .workflow-dialog {
    width: 100%;
    height: 100dvh;
    border-radius: 0;
  }

  body[data-riddle^="dendritic-riddle"] .puzzle-main {
    grid-template-columns: minmax(0, 1fr) !important;
    align-items: start !important;
  }

  body[data-riddle^="dendritic-riddle"] .visual-frame img {
    width: 100%;
    height: auto !important;
    max-height: 430px;
  }
}

@media (max-width: 720px) {
  body[data-riddle^="dendritic-riddle"] #flowStep1 .builder,
  body[data-riddle^="dendritic-riddle"] #flowStep2 .builder {
    grid-template-columns: minmax(0, 1fr) !important;
  }

  body[data-riddle^="dendritic-riddle"] .workflow-step:not([hidden]) {
    padding-inline: 13px !important;
  }

  body[data-riddle^="dendritic-riddle"] .step-node {
    padding-inline: 4px !important;

  }

  body[data-riddle^="dendritic-riddle"] .board-wrap {
    height: clamp(310px, 58dvh, 440px) !important;
  }
}

/* Floor 2 — temperature */
/* Floor 1 viewport-fit overrides: fill the iframe first and keep a single
   scroll surface only when the content truly cannot fit. */
body[data-riddle^="dendritic-riddle"] .workflow-backdrop {

body[data-riddle^="dendritic-riddle"] .workflow-step:not([hidden]) {
  padding: 8px clamp(12px, 2vw, 28px) 10px;

body[data-riddle^="dendritic-riddle"] .workflow-step:not([hidden]) > .step-actions {

  bottom: auto !important;
  min-height: 38px;
  padding: 0;
  border-top: 0;

      panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action,k=currentQuizKind();
        if(b.hasAttribute('data-map-trigger')){const i=Number(b.dataset.mapTrigger);mappingOpen=mappingOpen===i?-1:i;syncMappingUI();return}
        if(b.hasAttribute('data-map-select')){const i=Number(b.dataset.mapSelect),z=Number(b.dataset.zone);if(networkMapping[i]===String(z)){networkMapping[i]='';mappingOpen=-1;syncMappingUI();return}if(networkMapping.some((value,other)=>other!==i&&value===String(z)))return;networkMapping[i]=String(z);mappingOpen=-1;syncMappingUI();return}if(b.hasAttribute('data-map-clear')){networkMapping[Number(b.dataset.mapClear)]='';mappingOpen=-1;syncMappingUI();return}
        if(a==='start')setScreen('singleObserve');else if(a==='quiz1')setScreen('singleQuiz');else if(a==='quiz2')setScreen('networkQuiz');
        else if(a==='reveal'&&chosen[k].length>0&&chosen[k].every(x=>x.size)&&points[k]>=chosen[k].length){revealed[k]=true;replayCompleted[k]=false;replayTime[k]=0;replayPlaying[k]=true;const p=routePosition(k,0);mouse.x=p.x;mouse.y=p.y;mouse.target=null;render();resize()}
        else if(a==='replay'){replayCompleted[k]=false;replayTime[k]=0;replayPlaying[k]=true;const p=routePosition(k,0);mouse.x=p.x;mouse.y=p.y;mouse.target=null;render();resize()}
        else if(a==='network'&&reflection.single.every(x=>x.trim()))setScreen('networkObserve')
        else if(a==='finish'&&reflection.network.every(x=>x.trim())){downloadAnswersReport();panel.innerHTML=`<div class="story-card"><h3>כל הכבוד, השלמתם את הפעילות!</h3><p>תא בודד מאותת על מקום מסוים כשהעכבר נמצא בו. רשת תאים משלימה יחד קוד מרחבי שמאפשר להעריך את מיקומו בכל רחבי הקופסה.</p><button class="primary" data-action="restart">התחילו מחדש</button></div>`}
        else if(a==='restart'){points={single:0,network:0};chosen={single:[],network:[]};revealed={single:false,network:false};replayCompleted={single:false,network:false};reflection={single:['',''],network:['','']};replayTime={single:0,network:0};replayPlaying={single:false,network:false};networkMapping=Array(6).fill('');setScreen('intro')}
      });
      panel.addEventListener('input',e=>{if(!e.target.matches('[data-ref]'))return;const k=screen==='singleQuiz'?'single':'network';reflection[k][+e.target.dataset.ref]=e.target.value;const btn=panel.querySelector('[data-action="network"],[data-action="finish"]');if(btn)btn.disabled=!reflection[k].every(x=>x.trim())});
      function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);updateNeuronCards();draw();requestAnimationFrame(frame)}
      window.addEventListener('resize',resize);render();resize();resetMouse();requestAnimationFrame(frame);
    })();
  </script>
  <script>
    (() => {
      let sent = false;
      const send = () => {
        if (sent) return;
        sent = true;
        window.parent.postMessage({ source: "neural-code-riddle", type: "submitted", puzzleId: "mouse-place-cells" }, "*");
      };
      document.addEventListener("click", (event) => {
        if (event.target.closest('[data-action="finish"]')) window.setTimeout(send, 350);
      });
    })();
  </script>

<script data-standalone-responsive>
(() => {
  "use strict";

  const filename = "mouse-place-cells";
  const riddle = filename.startsWith("dendritic-riddle-") ? filename : filename;
  document.body.dataset.riddle = riddle;

  const reportFilenames = {
    "dendritic-riddle-1": "קומה 1 - חידה 1 - איתן ועמית.doc",
    "dendritic-riddle-2": "קומה 1 - חידה 2 - הכדורסלן.doc",
    "dendritic-riddle-3": "קומה 1 - חידה 3 - השירים האהובים.doc",
    "dendritic-riddle-4": "קומה 1 - חידה 4 - הקוף בג׳ונגל.doc",
    "skin-temperature": "קומה 2 - חידה 1 - פענוח טמפרטורת העור.docx",
    "movement-direction": "קומה 2 - חידה 2 - פענוח כיוון התנועה.docx",
    "hippocampal-object-neuron": "קומה 2 - חידה 3 - נוירון אובייקטים בהיפוקמפוס.docx",
    "language-neuron": "קומה 2 - חידה 4 - פענוח פעילות נוירון השפה.docx",
    "mouse-place-cells": "קומה 3 - חידה 1 - תאי מיקום.doc",
    "wormmind": "קומה 3 - חידה 2 - מוח, חיווט והתנהגות.doc"
  };

  const reportFilename = reportFilenames[riddle];
  if (reportFilename) {
    const nameReport = (anchor) => {
      if (anchor?.download) anchor.download = reportFilename;
    };
    const nativeAnchorClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function namedReportClick() {
      nameReport(this);
      return nativeAnchorClick.call(this);
    };
    document.addEventListener("click", (event) => nameReport(event.target.closest?.("a[download]")), true);
  }

  const wrapStageVisual = (stage, ringSelector, className) => {
    if (!stage || stage.querySelector(`:scope > .${className}`)) return;
    const ring = stage.querySelector(`:scope > ${ringSelector}`);
    if (!ring) return;
    const visual = document.createElement("div");
    visual.className = className;
    [...stage.children].filter((child) => child !== ring).forEach((child) => visual.appendChild(child));
    stage.insertBefore(visual, ring);
  };

  if (riddle === "movement-direction") {
    [document.getElementById("boardStage"), document.querySelector(".result-stage")].forEach((stage) => {
      wrapStageVisual(stage, ".plot-ring", "responsive-direction-visual");
      stage?.classList.add("responsive-direction-stage");
    });
  }

  if (riddle === "skin-temperature") {
    const prepareGauge = (stage, gaugeSelector, ringSelector) => {
      if (!stage || stage.querySelector(":scope > .responsive-gauge-visual")) return;
      const gauge = stage.querySelector(`:scope > ${gaugeSelector}`);
      const ring = stage.querySelector(`:scope > ${ringSelector}`);
      if (!gauge || !ring) return;
      const visual = document.createElement("div");
      visual.className = "responsive-gauge-visual";
      visual.appendChild(gauge);
      stage.insertBefore(visual, ring.nextSibling);
      stage.classList.add("responsive-gauge-stage");
    };

    prepareGauge(document.getElementById("gaugeStage"), "#temperatureGauge", ".plot-orbit");
    prepareGauge(document.querySelector(".result-gauge-stage"), "#resultTemperatureGauge", ".result-orbit");
  }
})();

</script>
</body>
</html>
